<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS S3 - Updating Object</title>
    <base href="{{site.url}}{{site.baseurl}}{{url_parentPath}}/" />
    <style>
        :root {color-scheme: light dark;}
        body {background-color: Canvas; color: CanvasText;}
    </style>
    <script type="module" src="../../../../../Scripts/js/global.js"></script>
    <script type="module" src="../../../../../Scripts/js/code-widget.js"></script>
    <script type="module" src="../../../../../Scripts/js/html-include.js"></script>
</head>
<body>
<script type="module" src="{{site.url}}{{site.baseurl}}/Scripts/js/global.js"></script>
<script type="module" src="{{site.url}}{{site.baseurl}}/Scripts/js/code-widget.js"></script>
<script type="module" src="{{site.url}}{{site.baseurl}}/Scripts/js/html-include.js"></script>
<div
    data-html-include="{{site.url}}{{site.baseurl}}/Scripts/html/Cloud/AWS/SimpleStorageService_ObjectManagement.html"
    data-mod-js="
        CodeWidget__UsrLib_OvrCfg(html, {
            'aws-s3--object-mgmt': {
                def: {
                    'vGrp-P--awsRegion': [
                        ['Please select a Region.'],
                        {
                            val: 'us-east-1',
                            txt: 'us-east-1',
                            attr: {
                                'data-grp-opts-val': JSON.stringify({
                                    'vP--s3BucketName': [
                                        {val: 'ieng--vm-image--windows--us-east-1'},
                                        {val: 'ieng--os-iso--us-east-1'},
                                    ],
                                }),
                            },
                        },
                        {
                            val: 'us-east-2',
                            txt: 'us-east-2',
                            attr: {
                                'data-grp-opts-val': JSON.stringify({
                                    'vP--s3BucketName': [{val: 'ieng--vm-image--windows--us-east-2'}],
                                }),
                            },
                        },
                        {
                            val: 'us-west-2',
                            txt: 'us-west-2',
                            attr: {
                                'data-grp-opts-val': JSON.stringify({
                                    'vP--s3BucketName': [{val: 'ieng--vm-image--windows--us-west-2'}],
                                }),
                            },
                        },
                    ],
                    'vP--awsProfile': [
                        ['Please select a Profile.'],
                        {val: 'usr.u-ieng--s3--vm-img--windows--ro'},
                        {val: 'usr.u-ieng--s3--vm-img--windows--rw'},
                    ],
                },
            },
        });
    "
></div>
</body>
</html>
