        body {background-color: Canvas; color: CanvasText;}

<script type="module" src="{{site.url}}{{site.baseurl}}/Scripts/js/global.js"></script>
<script type="module" src="{{site.url}}{{site.baseurl}}/Scripts/js/code-widget.js"></script>
<script type="module" src="{{site.url}}{{site.baseurl}}/Scripts/js/html-include.js"></script>
<div
    data-html-include="{{site.url}}{{site.baseurl}}/Scripts/html/OCP/Cluster--Info--Installation/AWS/Installation/AWS_IPI_Installation.html"
    data-mod-js="
        CodeWidget__UsrLib_OvrCfg(html, {
            'OCP--aws--IPI-Install': {
                def: {
                    'vGrp-EV--Team': [
                        ['Please select a Team.'],
                        {
                            val: 'rh-hp-mpex-ieng',
                            txt: 'Chaos & G11n (rh-hp-mpex-ieng)',
                            attr: {
                                'data-grp-opts-val': `{
                                    &quot;vEV--_BW__NOTE_NAME&quot;:    &quot;note.AWS--IAMuser--OCPinstaller--Chaos&G11n&quot;
                                }`
                            },
                        },
                        {
                            val: 'cspi-ocp-lp',
                            txt: 'Interop (cspi-ocp-lp)',
                            attr: {
                                'data-grp-opts-val': `{
                                    &quot;vEV--_BW__NOTE_NAME&quot;:    &quot;note.AWS--IAMuser--OCPinstaller--Interop&quot;
                                }`
                            },
                        },
                    ],
                    'vEV--_OCP__INSTLR_WAIT__CLUSTER__TRY': '1',
                    'vEV--_BW__NOTE_NAME': ['...PleaseSelectTeam...'],
                    'vEV--AWS_REGION': 'us-east-1',
                },
            },
        });
    "
></div>
