<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BitWarden CLI Installation</title>
    <base href="{{site.url}}{{site.baseurl}}{{page.url}}" />
    <style>
        :root {color-scheme: light dark;}
        body {background-color: Canvas; color: CanvasText;}
    </style>
    <script type="module" src="../../../../../Scripts/js/global.js"></script>
</head>
<body>
<script type="module" src="{{site.url}}{{site.baseurl}}/Scripts/js/global.js"></script>
<div style="font-family:monospace;font-size:large;line-height:normal;overflow:auto;white-space:nowrap;">
    <div style="float:left;min-width:100%;" tabindex="0">
<pre style="font-size:medium;">
(
    dlFile=/tmpfs/bw-cli--$$
    wget -qO "${dlFile}.zip" 'https://bitwarden.com/download/?app=cli&platform=linux'
    unzip "${dlFile}" -d "/usr/local/bin/"
    rm -rf "${dlFile}.zip"
)
</pre>
    </div>
</div>
</body>
</html>
