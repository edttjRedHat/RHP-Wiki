<h2>Maintenance Tasks</h2>
<div
    data-html-include="{{site.url}}{{site.baseurl}}/Scripts/html/Cloud/AWS/OpenSearch_Maintenance.html"
    data-mod-js="
        CodeWidget__UsrLib_OvrCfg(html, {
            'aws-opensearch--maintenance--domain': {
                def: {
                    'vGrp-EV--Team': [
                        ['Please select a Team.'],
                        {
                            val: 'rh-hp-mpex-ieng',
                            txt: 'Chaos &amp; G11n (rh-hp-mpex-ieng)',
                            attr: {
                                'data-grp-opts-val': `{
                                    &quot;vEV--_AWS__ROLE_NAME_SFX&quot;:   [{&quot;val&quot;: &quot;admin&quot;, &quot;txt&quot;: &quot;admin&quot;}, [{&quot;val&quot;: &quot;poweruser&quot;, &quot;txt&quot;: &quot;poweruser&quot;}]],
                                    &quot;vEV--AWS_ACCOUNT_ID&quot;:        [&quot;624914081466&quot;],
                                    &quot;vEV--_AWS__OS__DOM_NAME&quot;:    &quot;open-search&quot;,
                                    &quot;vEV--_AWS__OS__FQDN&quot;:        &quot;open-search.lp-chaos--svc--web-app.chaos.lp.devcluster.openshift.com&quot;
                                }`  ,
                            },
                        },
                    ],
                    'vEV--_AWS__ROLE_NAME_SFX': 'poweruser',
                    'vEV--AWS_REGION': 'us-west-1',
                    'vEV--AWS_ACCOUNT_ID': [['Please select Team.']],
                    'vEV--_AWS__OS__DOM_NAME': ['...PleaseSelectTeam...'],
                    'vEV--_AWS__OS__FQDN': ['...PleaseSelectTeam...'],
                },
            },
        });
    "
></div>

                    'vEV--_AWS__OS__ISM_KEEP_DAYS': '365',
